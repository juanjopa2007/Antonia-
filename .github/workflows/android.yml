name: Compilar app Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios y compilación
        run: ./gradlew test assembleDebug --stacktrace

      - name: Guardar informes de tests si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-tests
          path: android/**/build/reports/tests/
          if-no-files-found: ignore

      - name: Publicar APK como Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk antonia.apk
          gh release create "build-${{ github.run_number }}" antonia.apk \
            --title "Antonia, compilación ${{ github.run_number }}" \
            --notes "Versión de prueba. Descarga antonia.apk desde el móvil e instálala." \
            --target "${{ github.sha }}"
